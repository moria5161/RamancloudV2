# Include in the Nginx http context, before the RamanCloud server block.
limit_req_zone $binary_remote_addr zone=rc_api:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=rc_connections:10m;

map $http_upgrade $rc_legacy_connection_upgrade {
    default upgrade;
    '' close;
}

# Only Ketcher's Emscripten bindings require string-to-code evaluation.
map $uri $ramancloud_script_sources {
    default "'self' 'wasm-unsafe-eval'";
    /structure-editor.html "'self' 'unsafe-eval'";
}
