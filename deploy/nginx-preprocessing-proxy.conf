# RamanCloud root-site deployment include.
#
# Installed to:
# /www/server/panel/vhost/nginx/proxy/219.229.100.24/df2757e2069346b5e29bb639873573ce_219.229.100.24.conf
#
# Other applications keep their existing locations, including /api/.
# The legacy Streamlit site is served only under /old-version/.

#PROXY-START/

location = /preprocessing {
    include /www/server/nginx/conf/ramancloud-security-headers.conf;
    add_header Cache-Control "no-store" always;
    error_page 404 = @ramancloud_retired_not_found;
    return 404;
}

location ^~ /preprocessing/ {
    include /www/server/nginx/conf/ramancloud-security-headers.conf;
    add_header Cache-Control "no-store" always;
    error_page 404 = @ramancloud_retired_not_found;
    return 404;
}

# Override the legacy vhost-wide 404-to-home redirect for retired paths only.
location @ramancloud_retired_not_found {
    include /www/server/nginx/conf/ramancloud-security-headers.conf;
    add_header Cache-Control "no-store" always;
    return 404;
}

location = /old-version {
    return 308 https://$host/old-version/$is_args$args;
}

location ^~ /old-version/ {
    if ($scheme != https) { return 308 https://$host$request_uri; }
    if ($uri ~ "(^|/)\.") { return 404; }
    # Streamlit needs its own script policy, separate from the React frontend.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;
    client_max_body_size 200m;
    client_body_timeout 60s;
    limit_conn rc_connections 32;
    limit_conn_status 429;
    proxy_cache off;
    proxy_buffering off;
    proxy_next_upstream off;
    # Preserve the prefix: Streamlit's baseUrlPath is old-version.
    proxy_pass http://127.0.0.1:8501;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $rc_legacy_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cookie_path / /old-version/;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location = /ramancloud-api {
    return 308 https://$host/ramancloud-api/$is_args$args;
}

location ^~ /ramancloud-api/ {
    include /www/server/nginx/conf/ramancloud-security-headers.conf;
    if ($scheme != https) { return 308 https://$host$request_uri; }
    client_max_body_size 200m;
    client_body_timeout 60s;
    limit_req zone=rc_api burst=60 nodelay;
    limit_req_status 429;
    limit_conn rc_connections 24;
    limit_conn_status 429;
    proxy_cache off;
    proxy_next_upstream off;
    proxy_pass http://127.0.0.1:5000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Keep older backend rollbacks compatible with the current API namespace.
    proxy_cookie_path /preprocessing/ /ramancloud-api/;
    proxy_read_timeout 600s;
}

location ^~ /assets/ {
    include /www/server/nginx/conf/ramancloud-security-headers.conf;
    if ($scheme != https) { return 308 https://$host$request_uri; }
    if ($uri ~ "(^|/)\.") { return 404; }
    if ($uri ~* "\.(map|env|key|pem|bak)$") { return 404; }
    root /www/wwwroot/219.229.100.24/ramancloud;
    try_files $uri =404;
    error_page 404 = @ramancloud_asset_not_found;
    expires 1y;
}

location @ramancloud_asset_not_found {
    include /www/server/nginx/conf/ramancloud-security-headers.conf;
    return 404;
}

location ^~ / {
    include /www/server/nginx/conf/ramancloud-security-headers.conf;
    if ($scheme != https) { return 308 https://$host$request_uri; }
    # This ^~ prefix bypasses server-level regex locations: deny here as well.
    if ($uri ~ "(^|/)\.") { return 404; }
    if ($uri ~* "^/(backend|frontend|deploy|scripts|tests|node_modules)(/|$)") { return 404; }
    if ($uri ~* "\.(py|pyc|sqlite|sqlite3|db|sql|pem|key|env|log|bak|map)$") { return 404; }
    root /www/wwwroot/219.229.100.24/ramancloud;
    error_page 404 = @ramancloud_asset_not_found;
    try_files $uri $uri/ /index.html;
    expires -1;
}

#PROXY-END/
